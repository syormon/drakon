<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Drakon</title>
  <link rel="icon" href="favicon.ico">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1c1a17;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 24px;
      font-family: sans-serif;
    }
    h1 {
      font-size: 36px;
      font-weight: 500;
      color: #ffcc52;
      letter-spacing: 3px;
      text-transform: uppercase;
    }
    #game-container canvas { display: block; margin: 0 auto; }
    /* love.js types into this hidden box while the game takes text (it also brings up a
       phone's keyboard); keep it invisible and out of the layout */
    #keyboard { position: absolute; left: 0; top: 0; width: 1px; height: 1px; opacity: 0;
                border: 0; padding: 0; pointer-events: none; }
    #fs-btn {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
      color: #ccc; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px;
    }
    #fs-btn:hover { background: rgba(255,255,255,0.15); }
    #fs-btn svg { width: 14px; height: 14px; }
  </style>
</head>
<body>
  <h1>Drakon</h1>

  <div id="game-container">
    <script src="coi-serviceworker.js"></script>
    <!-- online play: the game reaches the browser's WebSockets through this (before player.js) -->
    <script src="drakonnet.js"></script>
    <!-- GAME.love is renamed to the repository's name by the CI build -->
    <script src="player.js?g=GAME.love&v=11.5"></script>
  </div>

  <button id="fs-btn" onclick="toggleFullscreen()">
    <svg viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M1 1h4v2H3v2H1V1zm10 0h4v4h-2V3h-2V1zM1 11h2v2h2v2H1v-4zm12 2h-2v2h4v-4h-2v2z" fill="#ccc"/>
    </svg>
    Fullscreen
  </button>

  <script>
    function toggleFullscreen() {
      var canvas = document.getElementById('canvas');
      if (!canvas) return;
      if (canvas.requestFullScreen) canvas.requestFullScreen();
      else if (canvas.webkitRequestFullScreen) canvas.webkitRequestFullScreen();
      else if (canvas.mozRequestFullScreen) canvas.mozRequestFullScreen();
    }
  </script>
</body>
</html>
